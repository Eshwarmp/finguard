<!DOCTYPE html>
<html>
<head>
    <title>FinGuard — Login</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-page">

<!-- Animated background blobs -->
<div class="bg-blob blob1"></div>
<div class="bg-blob blob2"></div>
<div class="bg-blob blob3"></div>

<div class="auth-card">
    <div class="auth-logo">🛡️ FinGuard</div>
    <h2 class="auth-title">Welcome back</h2>
    <p class="auth-sub">Login to your account</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
    {% endwith %}

    <form action="/login" method="POST">
        <div class="input-group">
            <span class="input-icon">👤</span>
            <input type="text" name="username" placeholder="Username" required autofocus>
        </div>
        <div class="input-group">
            <span class="input-icon">🔒</span>
            <input type="password" name="password" id="login-password" placeholder="Password" required>
            <span class="eye-icon" onclick="togglePassword('login-password', this)">👁️</span>
        </div>
        <button type="submit">Login →</button>
    </form>

    <p class="auth-switch">Don't have an account? <a href="/signup">Sign up</a></p>
</div>

<script>
function togglePassword(inputId, eyeEl) {
    const input = document.getElementById(inputId);
    if (input.type === 'password') {
        input.type = 'text';
        eyeEl.style.opacity = '1';
    } else {
        input.type = 'password';
        eyeEl.style.opacity = '0.4';
    }
}
</script>
</body>
</html>
