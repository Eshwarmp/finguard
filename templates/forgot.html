<!DOCTYPE html>
<html>
<head>
    <title>FinGuard — Forgot Password</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-page">

<div class="bg-blob blob1"></div>
<div class="bg-blob blob2"></div>
<div class="bg-blob blob3"></div>

<div class="auth-card">
    <div class="auth-logo">🛡️ FinGuard</div>
    <h2 class="auth-title">Forgot Password</h2>
    <p class="auth-sub">Enter your email — we'll send a reset link</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
    {% endwith %}

    <form action="/forgot-password" method="POST">
        <div class="input-group">
            <span class="input-icon">✉️</span>
            <input type="email" name="email" placeholder="Your registered email" required autofocus>
        </div>
        <button type="submit">Send Reset Link →</button>
    </form>

    <p class="auth-switch"><a href="/login">← Back to Login</a></p>
</div>

</body>
</html>
