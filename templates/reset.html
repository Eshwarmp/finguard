<!DOCTYPE html>
<html>
<head>
    <title>FinGuard — Reset Password</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-page">

<div class="bg-blob blob1"></div>
<div class="bg-blob blob2"></div>
<div class="bg-blob blob3"></div>

<div class="auth-card">
    <div class="auth-logo">🛡️ FinGuard</div>
    <h2 class="auth-title">Reset Password</h2>
    <p class="auth-sub">Enter your new password</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
    {% endwith %}

    <form action="/reset-password/{{ token }}" method="POST">
        <div class="input-group">
            <span class="input-icon">🔒</span>
            <input type="password" name="password" id="new-password" placeholder="New password (min 6 chars)" required>
            <span class="eye-icon" onclick="togglePassword('new-password', this)">👁️</span>
        </div>
        <div class="input-group">
            <span class="input-icon">🔒</span>
            <input type="password" name="confirm_password" id="confirm-password" placeholder="Confirm new password" required>
            <span class="eye-icon" onclick="togglePassword('confirm-password', this)">👁️</span>
        </div>
        <button type="submit">Reset Password →</button>
    </form>

    <p class="auth-switch"><a href="/login">← Back to Login</a></p>
</div>

<script>
function togglePassword(inputId, eyeEl) {
    const input = document.getElementById(inputId);
    if (input.type === 'password') {
        input.type = 'text';
        eyeEl.style.opacity = '1';
    } else {
        input.type = 'password';
        eyeEl.style.opacity = '0.4';
    }
}
</script>
</body>
</html>
